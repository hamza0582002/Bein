name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release under this tag (e.g. v1.0.0). Leave empty to just build the APKs.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - name: Assemble APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      # A release APK has to be signed before Android will install it. When the
      # repository provides a keystore we use it; otherwise we mint one for this
      # build so the artifact is still side-loadable.
      - name: Sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            echo "No unsigned release APK produced; skipping signing."
            exit 0
          fi

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "::notice::No signing secrets found — generating a throwaway key for this build."
            STORE_PASS=maktabate
            ALIAS=maktabate
            KEY_PASS=maktabate
            keytool -genkeypair -v -keystore keystore.jks -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Maktabate, OU=Reader, O=Maktabate, L=, S=, C=" >/dev/null
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore.jks --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \
            --out Maktabate-release.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs Maktabate-release.apk
          rm -f keystore.jks app-release-aligned.apk

      - name: Name the debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Maktabate-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Maktabate-apk
          path: |
            Maktabate-debug.apk
            Maktabate-release.apk
          if-no-files-found: error
          retention-days: 30

      # Publishing happens either from a v* tag or from a manual run that names
      # a tag; the action creates the tag at this commit when it does not exist.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Maktabate ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            قارئ كتب Maktabate — مكتبة ثلاثية الأبعاد تحاكي رفوف المكتبة الواقعية.

            - `Maktabate-debug.apk` — ثبّته مباشرة على هاتفك.
            - `Maktabate-release.apk` — نسخة الإصدار، موقّعة.
          files: |
            Maktabate-debug.apk
            Maktabate-release.apk
